<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="stylesheet" href="./assets/output.css" />
	<title>jandro.links - Enlaces de jandrodev</title>
</head>

<body class="max-w-xl min-h-screen mx-auto bg-gradient-to-b from-black via-sky-950 to-gray-800">
	<header class="text-white">
		<img src="./assets/me-big.webp" alt="jandrodev"
			class="object-cover h-[50vh] mask-radial-at-center mask-radial-from-45% mask-radial-to-80%" />

		<header class="flex flex-col items-center justify-center mb-8 -mt-4">
			<span
				class="z-10 flex items-center justify-center px-3 py-1 font-mono text-xl border rounded-full shadow-sm text-sky-400 bg-black/65 cursor-crosshair border-sky-500/50">@jandrodev</span>

			<h1 class="mt-1 text-3xl font-extrabold leading-tight">
				Alejandro Franco
			</h1>
		</header>

		<section class="flex justify-center gap-2">
			<!-- Twitch -->
			<a class="bg-purple-100 social-button" href="https://twitch.tv/shoteer__" target="_blank"
				rel="noopener noreferrer" aria-label="Twitch" title="Ir a twitch de @shoteer__">
				<!-- Cargar iconos svg mediante referencia symbol -->
				<svg width="28" height="28">
					<use xlink:href="./assets/sprite.svg#twitch" />
				</svg>
			</a>

			<!-- Github -->
			<a class="bg-zinc-900 social-button" href="https://github.com/jandro-dev" target="_blank"
				rel="noopener noreferrer" aria-label="Github" title="Ir a github de @jandrodev">
				<svg width="28" height="28">
					<use xlink:href="./assets/sprite.svg#github" />
				</svg>
			</a>

			<!-- Instagram -->
			<a class="bg-gradient-to-tr from-yellow-200 via-pink-600 to-purple-600 social-button"
				href="https://instagram.com/shoteer__" target="_blank" rel="noopener noreferrer" aria-label="Instagram"
				title="Ir a Instagram de @jandrodev">
				<svg width="28" height="28">
					<use xlink:href="./assets/sprite.svg#instagram" />
				</svg>
			</a>

			<!-- YouTube -->
			<a class="bg-white social-button" href="https://youtube.com/@Shoteer__" target="_blank" rel="noopener noreferrer"
				aria-label="YouTube" title="Ir a YouTube de @jandrodev">
				<svg width="28" height="28">
					<use xlink:href="./assets/sprite.svg#youtube" />
				</svg>
			</a>

			<!-- X -->
			<a class="bg-black social-button" href="https://x.com/shoteer__" target="_blank" rel="noopener noreferrer"
				aria-label="X" title="Ir a X de @jandrodev">
				<svg width="28" height="28">
					<use xlink:href="./assets/sprite.svg#x" />
				</svg>
			</a>

			<!-- LinkedIn -->
			<a class="bg-white social-button" href="https://linkedin.com/in/jandrodev" target="_blank"
				rel="noopener noreferrer" aria-label="LinkedIn" title="Ir a Linkedin de @jandrodev">
				<svg width="28" height="28">
					<use xlink:href="./assets/sprite.svg#linkedin" />
				</svg>
			</a>
		</section>

		<p class="px-4 mt-4 text-sm text-center text-balance text-midu-lol">
			Divulgador de programacion, streamer y creador de contenido. Enseñando
			JavaScript, React, Node.js de forma divertida.
		</p>

		<main class="pt-4 px-4">
			<div class="grid w-full grid-cols-3 grid-rows-2 gap-2">
				<a href="https://cursoreact.dev"
					class="relative flex flex-col items-start overflow-hidden border border-cyan-900 rounded-3xl bg-gradient-to-br from-cyan-900 via-cyan-700 to-cyan-500 hover:scale-105 hover:contrast-125 transition col-span-2 p-7 min-h-[180px]">

					<span class="absolute bottom-2 left-2 font-bold text-2xl">React.js</span>

					<svg class=" absolute -right-4 -bottom-4 -rotate-6 size-28 hover:-rotate-12" width="100" height="100">
						<use xlink:href="./assets/sprite.svg#react" />
					</svg>

					<span class="absolute top-2 left-2 text-xs border rounded-xl px-1 py-0.5">Curso de +14 clases</span>
				</a>
			</div>
		</main>
	</header>
</body>

</html>
